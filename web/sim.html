<!doctype html>
<!-- Developed with assistance from Claude Code (Anthropic), an AI coding assistant. See SI_DISCLOSURE.md. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Rover Simulator</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: rgba(12,19,36,.86); --solid: #0f1830; --text: #e8eefb; --muted: #94a3c0; --line: #24324d; --hover: #1a2744;
    --teal: #2dd4bf; --amber: #ffb020; --red: #ff7a59; --green: #86efac; --blue: #5aa9ff;
    --shadow: 0 10px 30px rgba(0,0,0,.5), 0 0 0 1px rgba(130,160,220,.14);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #000; color: var(--text);
               font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .glass { background: var(--bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
           border-radius: 14px; box-shadow: var(--shadow); padding: 10px 12px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .muted { color: var(--muted); }
  .tab { font-variant-numeric: tabular-nums; }

  /* ---- HUD ---- */
  #hud > * { position: fixed; z-index: 5; }
  #topL { top: 12px; left: 12px; width: 300px; }
  #topL .big { font-size: 15px; font-weight: 600; }
  .bar { height: 7px; border-radius: 4px; background: #ffffff14; overflow: hidden; margin-top: 4px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--teal); border-radius: 4px; transition: width .2s; }
  .bar.amber > i { background: var(--amber); } .bar.red > i { background: var(--red); } .bar.blue > i { background: var(--blue); }
  #alerts { top: 14px; left: 50%; transform: translateX(-50%); width: min(520px, 90vw); display: grid; gap: 6px; pointer-events: none; }
  .alert { background: var(--bg); border-radius: 10px; padding: 8px 12px; box-shadow: var(--shadow); border-left: 4px solid var(--teal);
           animation: pop .25s ease-out; }
  .alert.warn { border-left-color: var(--amber); } .alert.bad { border-left-color: var(--red); } .alert.good { border-left-color: var(--green); }
  @keyframes pop { from { opacity: 0; transform: translateY(-8px); } }
  #topR { top: 12px; right: 12px; display: grid; gap: 8px; justify-items: end; }
  #mini { width: 220px; height: 220px; border-radius: 50%; box-shadow: var(--shadow); background: #0b1220; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .btn { background: var(--bg); border: 0; border-radius: 10px; padding: 7px 11px; box-shadow: var(--shadow); color: var(--text); }
  .btn:hover { background: var(--hover); }
  .btn.on { background: #12353a; color: var(--teal); }
  .btn.pri { background: var(--teal); color: #04201c; font-weight: 600; }
  .btn.pri:hover { background: #5eead4; }
  .btn[disabled] { opacity: .45; cursor: default; }
  #botL { bottom: 12px; left: 12px; width: 330px; }
  #speed { font-size: 38px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  #speed small { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 4px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; margin-top: 8px; }
  .kv { display: flex; justify-content: space-between; gap: 8px; font-variant-numeric: tabular-nums; }
  .kv span:first-child { color: var(--muted); }
  #botC { bottom: 12px; left: 50%; transform: translateX(-50%); display: grid; gap: 6px; justify-items: center; }
  #warp { display: flex; align-items: center; gap: 6px; }
  #warpVal { min-width: 78px; text-align: center; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  #botR { bottom: 12px; right: 12px; width: 250px; }
  #fleet { bottom: 84px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; padding: 5px 7px; }
  #fleet .btn { padding: 5px 10px; box-shadow: none; background: #ffffff10; }
  #fleet .btn.on { background: #12353a; color: var(--teal); }
  #cruiseOv { inset: 0; background: radial-gradient(ellipse at center, rgba(8,12,24,.55), rgba(5,8,16,.92)); display: grid; place-items: center; z-index: 8; }
  #cruiseOv .box { width: min(560px, 92vw); text-align: center; }
  #cruiseOv h2 { margin: 0 0 4px; font-size: 22px; font-weight: 500; }
  #cruiseTrack { position: relative; height: 54px; margin: 18px 0 8px; }
  #cruiseTrack .line { position: absolute; left: 0; right: 0; top: 26px; height: 4px; border-radius: 2px; background: #ffffff1f; }
  #cruiseTrack .done { position: absolute; left: 0; top: 26px; height: 4px; border-radius: 2px; background: var(--amber); width: 0; }
  #cruiseTrack .rv { position: absolute; top: 12px; width: 30px; height: 30px; margin-left: -15px; font-size: 26px; text-align: center; line-height: 30px; }
  #chat { top: 236px; left: 12px; width: 300px; display: none; pointer-events: none; }
  #chat.show { display: block; }
  #chatLog { max-height: 150px; overflow-y: auto; font-size: 12.5px; background: var(--bg); border-radius: 12px; padding: 6px 10px; box-shadow: var(--shadow); }
  #chatLog:empty { display: none; }
  .cl { margin: 2px 0; overflow-wrap: anywhere; } .cl.sys { color: var(--muted); font-style: italic; }
  #chatIn { pointer-events: auto; width: 100%; margin-top: 6px; border: 1px solid var(--teal); border-radius: 10px; background: var(--solid); color: var(--text); padding: 8px 10px; font: inherit; user-select: text; }
  #plist { top: 336px; right: 12px; width: 230px; padding: 8px 10px; }
  .prow { display: flex; align-items: center; gap: 6px; padding: 2px 0; font-size: 12.5px; } .prow i { width: 10px; height: 10px; border-radius: 50%; flex: none; } .prow .muted { margin-left: auto; font-size: 11.5px; }
  #netBadge { top: 12px; left: 322px; padding: 5px 10px; font-size: 12px; } #netBadge .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #6b7a99; margin-right: 4px; } #netBadge .dot.on { background: var(--green); }
  .inp { width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--solid); color: var(--text); padding: 7px 10px; font: inherit; user-select: text; }
  .live { background: #3d1f14; color: #ffa070; border-radius: 999px; padding: 0 7px; font-size: 11px; font-weight: 600; }
  #hint { position: fixed; left: 50%; bottom: 150px; transform: translateX(-50%); z-index: 4; color: #cfe; text-shadow: 0 1px 4px #000; text-align: center; pointer-events: none; }

  /* ---- windows ---- */
  .overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(4,8,18,.72); padding: 16px; overflow-y: auto; }
  .panel { width: min(880px, 100%); max-height: 92vh; overflow-y: auto; background: var(--solid); border-radius: 18px; box-shadow: var(--shadow); padding: 22px 26px; }
  .panel h1 { margin: 0 0 2px; font-size: 24px; font-weight: 500; }
  .panel h3 { margin: 18px 0 8px; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .card.sel { border-color: var(--teal); background: #12353a55; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { background: transparent; border: 0; padding: 6px 12px; color: var(--muted); }
  .seg button.on { background: #12353a; color: var(--teal); }
  .up { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .up .lv { display: flex; gap: 4px; margin-top: 4px; }
  .up .lv i { width: 22px; height: 6px; border-radius: 3px; background: #ffffff1c; }
  .up .lv i.on { background: var(--teal); }
  .chk { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
  .chk input { accent-color: var(--teal); width: 15px; height: 15px; }
  kbd { background: #ffffff14; border-radius: 5px; padding: 1px 6px; font-family: inherit; font-size: 12px; }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12.5px; }
  #loading { position: fixed; inset: 0; z-index: 30; background: #05080f; display: grid; place-items: center; text-align: center; }
  #loading .spin { width: 42px; height: 42px; margin: 0 auto 14px; border: 4px solid #ffffff22; border-top-color: var(--teal); border-radius: 50%; animation: sp 1s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .35s; z-index: 15; }
  @media (max-width: 1100px) {
    #botC { left: 354px; transform: none; } #fleet { left: 354px; transform: none; } #warp { gap: 4px; } #warp .btn { padding: 6px 8px; } #warpVal { min-width: 58px; font-size: 16px; }
  }
  @media (max-width: 900px) {
    #mini { width: 150px; height: 150px; } #botR { display: none; } #topL { width: 240px; } #botL { width: 250px; }
  }

  /* ---- phone and tablet: touch controls and a compact interface ---- */
  html, body { overscroll-behavior: none; touch-action: none; }
  #gl { touch-action: none; }
  #touchUI { position: fixed; inset: 0; z-index: 6; pointer-events: none; display: none; }
  body.touch #touchUI:not([hidden]) { display: block; }
  #touchUI * { touch-action: none; -webkit-tap-highlight-color: transparent; }
  #joy { position: absolute; left: max(18px, env(safe-area-inset-left)); bottom: max(22px, env(safe-area-inset-bottom)); width: 136px; height: 136px; border-radius: 50%;
         background: rgba(255,255,255,.07); border: 2px solid rgba(255,255,255,.28); pointer-events: auto; }
  #joyKnob { position: absolute; left: 40px; top: 40px; width: 56px; height: 56px; border-radius: 50%; background: rgba(45,212,191,.55); border: 2px solid rgba(255,255,255,.7); }
  .tb { pointer-events: auto; width: 48px; height: 48px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); background: rgba(12,19,36,.7); color: #fff; font-size: 17px; padding: 0; backdrop-filter: blur(6px); }
  .tb:active, .tb.on { background: rgba(45,212,191,.55); }
  .tb.big { position: absolute; right: max(14px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom)); width: 88px; height: 88px; font-size: 30px; }
  #tbGrid { position: absolute; right: calc(max(14px, env(safe-area-inset-right)) + 100px); bottom: max(18px, env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(4, 48px); gap: 6px; pointer-events: none; }
  #tbGrid .tb { pointer-events: auto; }
  @media (pointer: coarse), (max-width: 820px) {
    #hud > * { font-size: 11.5px; }
    #topL { width: 188px; padding: 6px 9px; top: max(8px, env(safe-area-inset-top)); left: 8px; }
    #topL .big { font-size: 12.5px; } #mSub, #topL .grid2 { display: none; }
    #netBadge { top: max(8px, env(safe-area-inset-top)); left: 204px; font-size: 11px; padding: 3px 8px; }
    #alerts { top: 52px; width: min(380px, 62vw); font-size: 12px; } .alert { padding: 6px 10px; }
    #topR { top: max(8px, env(safe-area-inset-top)); right: 8px; } #mini { width: 104px; height: 104px; } #topR .btns { display: none; }
    #botL { top: 66px; bottom: auto; left: 8px; width: 176px; padding: 6px 9px; }
    #speed { font-size: 26px; } #speed small { font-size: 10px; }
    #botL > .row:nth-of-type(3), #botL > .row:nth-of-type(4), #botL .grid2 { display: none; }
    #botC { top: 8px; bottom: auto; left: 50%; transform: translateX(-50%); } #botC .glass { padding: 3px 5px; }
    #warp .btn { padding: 4px 9px; } #warpVal { min-width: 50px; font-size: 14px; } #bAuto, #bCruise { display: none; }
    #fleet { top: 120px; bottom: auto; left: auto; right: 8px; transform: none; padding: 3px 5px; gap: 3px; } #fleet .btn { padding: 4px 7px; font-size: 14px; }
    #botR, #plist, #hint { display: none !important; }
    #chat { top: auto; bottom: 168px; left: 8px; width: 56vw; }
    #cruiseOv .box { padding: 14px 16px !important; } #cruiseOv h2 { font-size: 17px; }
    .overlay { padding: 8px; align-items: start; } .panel { padding: 14px 14px; border-radius: 14px; max-height: 96vh; } .panel h1 { font-size: 19px; }
    .btn { min-height: 38px; } .cols { grid-template-columns: 1fr; } .keys { font-size: 11.5px; }
    .seg button { padding: 8px 12px; } .chk { padding: 6px 0; } .chk input { width: 20px; height: 20px; }
  }
  @media (max-width: 560px) {
    #tbGrid { right: max(14px, env(safe-area-inset-right)); bottom: 122px; }
    #topL { width: 150px; } #netBadge { left: 166px; top: 44px; }
    #botC { top: auto; bottom: 176px; left: 8px; transform: none; }
    #chat { bottom: 232px; }
    #botL .row > span.muted { width: 44px !important; } #botL #vBat { width: 70px !important; }
    #speed small { display: block; line-height: 1.1; margin: 0; }
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="fade"></div>

<div id="hud" hidden>
  <div id="topL" class="glass">
    <div class="big" id="mTitle"></div>
    <div class="muted tab" id="mSub"></div>
    <div class="bar amber"><i id="mProg"></i></div>
    <div class="grid2">
      <div class="kv"><span id="kT"></span><b id="mClock"></b></div>
      <div class="kv"><span id="kLoc"></span><b id="mLocal"></b></div>
      <div class="kv"><span id="kScore"></span><b id="mCredits"></b></div>
      <div class="kv"><span id="kSamples"></span><b id="mSamples"></b></div>
    </div>
  </div>
  <div id="alerts"></div>
  <div id="topR">
    <canvas id="mini" width="440" height="440"></canvas>
    <div class="btns">
      <button class="btn" id="bCam"></button><button class="btn" id="bLight"></button>
      <button class="btn" id="bGarage"></button><button class="btn" id="bPause"></button>
    </div>
  </div>
  <div id="botL" class="glass">
    <div class="row" style="justify-content:space-between;align-items:flex-end">
      <div id="speed">0<small>km/h</small></div>
      <div style="text-align:right"><div class="muted" id="kHead"></div><b id="vHead" class="tab" style="font-size:16px"></b></div>
    </div>
    <div class="row" style="margin-top:6px"><span class="muted" style="width:56px" id="kBat"></span><div class="bar" style="flex:1"><i id="bBat"></i></div><b class="tab" id="vBat" style="width:78px;text-align:right"></b></div>
    <div class="row"><span class="muted" style="width:56px" id="kTmp"></span><div class="bar amber" style="flex:1"><i id="bTmp"></i></div><b class="tab" id="vTmp" style="width:78px;text-align:right"></b></div>
    <div class="row"><span class="muted" style="width:56px" id="kDmg"></span><div class="bar red" style="flex:1"><i id="bDmg"></i></div><b class="tab" id="vDmg" style="width:78px;text-align:right"></b></div>
    <div class="grid2">
      <div class="kv"><span id="kPit"></span><b id="vPit"></b></div>
      <div class="kv"><span id="kRol"></span><b id="vRol"></b></div>
      <div class="kv"><span id="kPow"></span><b id="vPow"></b></div>
      <div class="kv"><span id="kSol"></span><b id="vSol"></b></div>
      <div class="kv"><span id="kAlt"></span><b id="vAlt"></b></div>
      <div class="kv"><span id="kSlip"></span><b id="vSlip"></b></div>
    </div>
  </div>
  <div id="botC">
    <div class="glass" style="padding:6px 8px">
      <div id="warp">
        <button class="btn" id="wSlow">⏴</button><div id="warpVal"></div><button class="btn" id="wFast">⏵</button>
        <span style="width:8px"></span>
        <button class="btn" id="bAuto"></button>
        <button class="btn" id="bCruise"></button>
      </div>
    </div>
  </div>
  <div id="fleet" class="glass"><button class="btn" id="fl1"></button><button class="btn" id="fl2"></button><button class="btn" id="fl3"></button><button class="btn" id="flAct" title="V">V</button></div>
  <div id="botR" class="glass">
    <div class="big row" style="justify-content:space-between"><b id="wTitle"></b><span id="wIcon" style="font-size:18px"></span></div>
    <div class="grid2" style="grid-template-columns:1fr">
      <div class="kv"><span id="kSun"></span><b id="vSun"></b></div>
      <div class="kv"><span id="kAmb"></span><b id="vAmb"></b></div>
      <div class="kv"><span id="kTau"></span><b id="vTau"></b></div>
      <div class="kv"><span id="kWind"></span><b id="vWind"></b></div>
      <div class="kv"><span id="kVis"></span><b id="vVis"></b></div>
      <div class="kv"><span id="kDose"></span><b id="vDose"></b></div>
    </div>
  </div>
  <div id="hint"></div>
  <div id="netBadge" class="glass" hidden></div>
  <div id="chat"><div id="chatLog"></div><input id="chatIn" maxlength="200" hidden></div>
  <div id="plist" class="glass" hidden></div>
  <div id="cruiseOv" hidden>
    <div class="glass box" style="padding:22px 26px">
      <h2 id="cTitle"></h2><div class="muted" id="cSub"></div>
      <div id="cruiseTrack"><div class="line"></div><div class="done" id="cDone"></div><div class="rv" id="cRv">🚙</div></div>
      <div class="grid2"><div class="kv"><span id="kcT"></span><b id="cClock"></b></div><div class="kv"><span id="kcD"></span><b id="cDist"></b></div>
        <div class="kv"><span id="kcB"></span><b id="cBat"></b></div><div class="kv"><span id="kcS"></span><b id="cState"></b></div></div>
      <div class="row" style="justify-content:center;margin-top:16px;gap:10px">
        <button class="btn" id="cSlow">⏴</button><b id="cWarp" class="tab" style="min-width:110px"></b><button class="btn" id="cFast">⏵</button>
        <button class="btn pri" id="cStop"></button>
      </div>
    </div>
  </div>
</div>

<div id="touchUI" hidden>
  <div id="joy"><div id="joyKnob"></div></div>
  <div id="tbGrid">
    <button class="tb" id="tbPause">⏸</button><button class="tb" id="tbChat">💬</button><button class="tb" id="tbCruise">⏩</button><button class="tb" id="tbAuto">AI</button>
    <button class="tb" id="tbCam">🎥</button><button class="tb" id="tbH">🚁</button><button class="tb" id="tbV">V</button><button class="tb" id="tbDown">⬇</button>
  </div>
  <button class="tb big" id="tbMain">🛑</button>
</div>
<div id="brief" class="overlay" hidden></div>
<div id="garage" class="overlay" hidden></div>
<div id="pause" class="overlay" hidden></div>
<div id="end" class="overlay" hidden></div>
<div id="loading"><div><div class="spin"></div><div id="loadMsg">Loading…</div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/sim/core.js"></script>
<script src="/sim/render.js"></script>
<script src="/sim/net.js"></script>
<script src="/sim/game.js"></script>
</body>
</html>
